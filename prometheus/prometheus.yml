# Configuration Prometheus pour un lancement local (docker compose).
# La version Kubernetes vit dans k8s/prometheus/configmap.yaml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: demo-app
    static_configs:
      - targets: ["demo-app:8000"]
